<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 绘境 · 应用图标：森翠圆角底板 + 画框山水 + 星光笔触 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7A4D"/>
      <stop offset="0.55" stop-color="#3A5F3B"/>
      <stop offset="1" stop-color="#26412A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6E9"/>
      <stop offset="1" stop-color="#EEE6CF"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB39A"/>
      <stop offset="1" stop-color="#6E9A7C"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#22663F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A6"/>
      <stop offset="1" stop-color="#E2B04A"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="232" y="268" width="560" height="488" rx="44"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F2414" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- 画框 -->
  <rect x="208" y="244" width="608" height="536" rx="64" fill="#F6F1E4" opacity="0.18"/>
  <g clip-path="url(#frame)">
    <rect x="232" y="268" width="560" height="488" fill="url(#sky)"/>
    <!-- 太阳 -->
    <circle cx="620" cy="400" r="54" fill="url(#gold)"/>
    <!-- 远山 -->
    <path d="M232 620 L362 470 Q380 452 398 470 L500 580 L600 488 Q618 472 636 488 L792 640 L792 756 L232 756 Z" fill="url(#far)"/>
    <!-- 近山 -->
    <path d="M232 700 L392 548 Q412 530 432 548 L560 664 L640 600 Q658 586 676 600 L792 700 L792 756 L232 756 Z" fill="url(#near)"/>
    <!-- 水面笔触 -->
    <path d="M282 726 Q420 700 560 722 T770 716" fill="none" stroke="#FBF6E9" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- 星光笔触：一笔划过画框右上角 -->
  <path d="M600 316 Q700 240 790 214" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <path d="M790 150 C798 196 812 210 858 218 C812 226 798 240 790 286 C782 240 768 226 722 218 C768 210 782 196 790 150 Z" fill="url(#gold)"/>
  <path d="M700 132 C703 150 708 155 726 158 C708 161 703 166 700 184 C697 166 692 161 674 158 C692 155 697 150 700 132 Z" fill="#FFF4D2"/>
</svg>
