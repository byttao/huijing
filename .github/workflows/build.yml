name: 打包

# 只手动运行（workflow_dispatch）：校验版本 → 编译 macOS / Windows → 上传构建产物。
# 不自动发布：Release 用本机打好的产物通过 scripts/release.sh 创建（打标签时不会重复编译、重复上传附件）。
on:
  workflow_dispatch:

jobs:
  version:
    name: 校验版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取并校验版本
        id: read
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$VERSION package.json=$PKG Cargo.toml=$CARGO"
          if [ "$PKG" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "::error::package.json / Cargo.toml / tauri.conf.json 的版本不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          - name: Windows
            os: windows-latest
            rust-targets: ""
            # 便携版：只编译 exe，不打安装包
            args: --no-bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: 编译
        run: npx tauri build ${{ matrix.args }}

      # 用与 Release 附件相同的 ASCII 文件名（GitHub 会丢掉附件名里的中文，如「绘境_0.1.0_便携版.exe」变成「_0.1.0_.exe」）
      - name: 制作 DMG（含安装脚本）
        if: runner.os == 'macOS'
        run: bash scripts/macos/make-dmg.sh "" dist-mac "Huijing_${VERSION}_universal.dmg"

      - name: 整理便携版 exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item src-tauri/target/release/huijing.exe "dist-win/Huijing_$($env:VERSION)_portable.exe"
          Get-ChildItem dist-win

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Huijing-macOS
          path: dist-mac/*.dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Huijing-Windows
          path: dist-win/*.exe
